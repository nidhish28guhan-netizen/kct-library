services:
  backend:
    build:
      context: ./backend
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env before compose up}
      - PORT=4000
    volumes:
      - clms-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clms-data:
